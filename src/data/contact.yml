# The contact block: the rows under "Get in touch" on the home page, and the
# same rows on /cv/. Rendered by src/components/Contact.astro. `email: true`
# means SITE.email from src/consts.ts, obfuscated in the served HTML.
#
# Only the email, on purpose. The template also derives a "where" row from the
# first `current: true` entry in cv.yml — so the CV marks the current position
# with `end: present` instead.

- label: email
  email: true
