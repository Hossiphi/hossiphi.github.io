# The groups /projects/ sorts its entries into. A project's `category` is one
# of these ids — a `reference()`, so a misspelt one fails the build. Groups
# render by `order`, lower first.
- id: current
  order: 1
  label: Current
  blurb: What I work on now.
- id: past
  order: 2
  label: Earlier
  blurb: Projects I contributed to before.
