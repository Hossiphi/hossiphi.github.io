summary: >-
  A researcher at the Karlsruhe Institute of Technology since 2020. In my
  research, I make security knowledge explicit throughout the software life
  cycle: security requirements, the assumptions a system's security rests on,
  and the trace links that connect them to architecture and code. Currently, I
  apply this to energy systems within the KASTEL Security Research Labs.

interests:
  - Secure software engineering
  - Traceability
  - Requirements engineering
  - Assumption management

