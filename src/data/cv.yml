summary: >-
  Doctoral researcher at the Karlsruhe Institute of Technology since 2020, in
  the group of Prof. Anne Koziolek. My research makes security knowledge
  explicit throughout the software life cycle: security requirements, the
  assumptions a system's security rests on, and their trace links to
  architecture and code, currently applied to energy systems within the KASTEL
  Security Research Labs. I teach Software Engineering II (KIT teaching award
  2025), supervise seminars, practical courses and theses, and review for
  venues such as ICSE, FSE, ASE and ICSA.

interests:
  - Secure software engineering
  - Traceability
  - Requirements engineering
  - Assumption management

