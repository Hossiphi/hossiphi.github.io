summary: >-
  I am a doctoral researcher at the Karlsruhe Institute of Technology (KIT),
  where I have been working in the group of Prof. Anne Koziolek since 2020. In
  my research, I make security knowledge explicit throughout the software life
  cycle: security requirements, the assumptions a system's security rests on,
  and the trace links that connect them to architecture and code. Currently, I
  apply this to energy systems within the KASTEL Security Research Labs. Besides
  research, I teach: since 2022, I have been the teaching assistant for
  Software Engineering II, which received the KIT teaching award in 2025, and I
  supervise seminars, practical courses and theses. Outside of work, I am a
  mother.

interests:
  - Secure software engineering
  - Traceability
  - Requirements engineering
  - Assumption management

